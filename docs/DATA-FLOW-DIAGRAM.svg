<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Etika high-level data flow</title>
  <desc id="desc">A simple flow from business facts, through deterministic rules and three specialists using TiDB evidence, to a scored compliance dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#b6c8b5" stroke-width="1.15"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#9fbb4e" stroke-width="1.15"/></marker>
    <style>
      .bg{fill:#0d2017}.rule{stroke:#486453;stroke-width:1}.box{fill:#10251a;stroke:#9fbb4e;stroke-width:1.5}.ai{fill:#10251a;stroke:#c06ac5;stroke-width:1.5}.data{fill:#13261f;stroke:#8aa490;stroke-width:1.35}.line{fill:none;stroke:#b6c8b5;stroke-width:1.05;marker-end:url(#arrow)}.green{fill:none;stroke:#9fbb4e;stroke-width:1.15;marker-end:url(#arrowGreen)}.title{font:500 62px Arial,Helvetica,sans-serif;fill:#f0efe3}.big{font:600 24px Arial,Helvetica,sans-serif;fill:#f0efe3}.label{font:600 17px Arial,Helvetica,sans-serif;fill:#f0efe3}.small{font:15px Arial,Helvetica,sans-serif;fill:#b6c8b5}.tiny{font:13px Arial,Helvetica,sans-serif;fill:#9db19f}.cap{font:600 14px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#a5bd55}
    </style>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <text x="70" y="46" class="cap">ETIKA  /  STORM HACKS 2026</text>
  <line x1="70" y1="66" x2="470" y2="66" class="rule"/>
  <text x="70" y="165" class="title">From facts</text>
  <text x="70" y="232" class="title">to action.</text>
  <text x="72" y="280" class="small" style="font-size:18px">A personalised, cited compliance plan</text>
  <text x="72" y="306" class="small" style="font-size:18px">for Vancouver sole proprietors.</text>
  <text x="72" y="400" class="cap">THE TRUST MODEL</text>
  <text x="72" y="434" class="big" style="font-size:21px">Rules decide.</text>
  <text x="72" y="465" class="big" style="font-size:21px">AI explains.</text>
  <text x="72" y="496" class="big" style="font-size:21px">The owner stays in control.</text>
  <text x="72" y="570" class="tiny">Unknown answers stay unknown.</text>
  <text x="72" y="594" class="tiny">Every claim is tied to official evidence.</text>

  <rect x="710" y="46" width="310" height="80" rx="2" class="box"/>
  <text x="730" y="79" class="big">Business profile</text>
  <text x="730" y="104" class="small">Owner-confirmed facts + revenue</text>

  <rect x="1080" y="80" width="310" height="80" rx="2" class="box"/>
  <text x="1100" y="113" class="big">Follow-up questions</text>
  <text x="1100" y="138" class="small">Only for missing facts</text>
  <path d="M1020 86 H1080" class="line"/>
  <path d="M1080 144 H1050 V86 H1020" class="green"/>
  <text x="1038" y="70" class="tiny">complete profile</text>

  <rect x="710" y="180" width="310" height="88" rx="2" class="ai"/>
  <text x="730" y="214" class="big">Rules engine</text>
  <text x="730" y="239" class="small">Applicability + tax calculators</text>
  <path d="M865 126 V180" class="line"/>

  <rect x="710" y="320" width="310" height="78" rx="2" class="box"/>
  <text x="730" y="353" class="big">Orchestrator</text>
  <text x="730" y="377" class="small">Routes work to the right specialist</text>
  <path d="M865 268 V320" class="line"/>

  <rect x="530" y="456" width="210" height="74" rx="2" class="box"/>
  <text x="550" y="486" class="label">The Registrar</text>
  <text x="550" y="509" class="small">Names + licences</text>
  <rect x="760" y="456" width="210" height="74" rx="2" class="box"/>
  <text x="780" y="486" class="label">The Counter</text>
  <text x="780" y="509" class="small">PST + GST</text>
  <rect x="990" y="456" width="210" height="74" rx="2" class="box"/>
  <text x="1010" y="486" class="label">The Foreman</text>
  <text x="1010" y="509" class="small">Hiring + payroll</text>
  <path d="M820 398 V428 H635 V456" class="line"/>
  <path d="M865 398 V456" class="line"/>
  <path d="M910 398 V428 H1095 V456" class="line"/>

  <rect x="710" y="586" width="310" height="82" rx="2" class="ai"/>
  <text x="730" y="618" class="big">Evidence &amp; explanations</text>
  <text x="730" y="643" class="small">Grounded AI explanations with citations</text>
  <path d="M635 530 V558 H865 V586" class="line"/>
  <path d="M865 530 V586" class="line"/>
  <path d="M1095 530 V558 H865 V586" class="line"/>

  <rect x="1080" y="586" width="310" height="82" rx="2" class="data"/>
  <text x="1100" y="618" class="big">TiDB Cloud</text>
  <text x="1100" y="643" class="small">Official sources, registry + evidence</text>
  <path d="M1020 627 H1080" class="green"/>
  <path d="M1080 650 H1055 V680 H1020" class="line"/>

  <rect x="710" y="722" width="310" height="78" rx="2" class="ai"/>
  <text x="730" y="754" class="big">Validate, score, sequence</text>
  <text x="730" y="778" class="small">Code checks citations and priorities</text>
  <path d="M865 668 V722" class="line"/>

  <rect x="680" y="840" width="370" height="48" rx="2" class="box"/>
  <text x="700" y="872" class="big">Dashboard: Now, Next, Later</text>
  <path d="M865 800 V840" class="line"/>
</svg>
